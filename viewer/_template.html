<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>札幌都心 交通網 Phase 0 ビューワ</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
  :root{
    --ink:#1a1c1e; --ink-2:#5a5f66; --ink-3:#8b9199;
    --line:#d8dce0; --panel:#f7f8fa; --paper:#fbfcfd;
    --lattice:#3d7ab8; --back:#d98c3f; --off:#9aa2ab; --out:#c2555c;
    --tunnel:#7b52c4; --cordon:#2f8f6b;
  --stop:#d64545; --oneway:#c1571f; --speed:#7b52c4;
  --signal:#3d8b40; --ctrl:#1f6feb; --census:#b8860b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:"Helvetica Neue",-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
    font-size:13px; line-height:1.55; color:var(--ink); background:var(--paper);
  }
  #map{position:absolute;inset:0}
  .card{
    position:absolute; background:rgba(251,252,253,.95); border:1px solid var(--line);
    border-radius:8px; box-shadow:0 2px 12px rgba(0,0,0,.08); backdrop-filter:blur(6px);
  }
  #panel{top:14px; left:14px; width:296px; max-height:calc(100% - 28px); overflow:auto; padding:14px 16px}
  #panel h1{font-size:15px;font-weight:600;margin:0 0 2px}
  #panel .sub{color:var(--ink-2);font-size:11.5px;margin:0 0 12px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  h2{font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--ink-3);
     margin:16px 0 7px;text-transform:uppercase}
  h2:first-of-type{margin-top:0}
  .kv{display:grid;grid-template-columns:1fr auto;gap:2px 10px;
      font-variant-numeric:tabular-nums;font-size:12px}
  .kv span:nth-child(even){font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink)}
  .kv span:nth-child(odd){color:var(--ink-2)}
  label.row{display:flex;align-items:center;gap:8px;padding:3px 0;cursor:pointer;font-size:12.5px}
  label.row input{margin:0;accent-color:var(--lattice)}
  .sw{width:16px;height:3px;border-radius:2px;flex:0 0 16px}
  .sw.dot{height:9px;width:9px;border-radius:50%}
  select,button{font:inherit;font-size:12px;border:1px solid var(--line);background:#fff;
    border-radius:6px;padding:5px 8px;color:var(--ink);width:100%}
  button{cursor:pointer}
  button:hover{border-color:var(--ink-3)}
  .bar{height:7px;border-radius:3px;background:var(--line);overflow:hidden;margin:2px 0 6px}
  .bar i{display:block;height:100%;background:var(--lattice)}
  .note{font-size:11.5px;color:var(--ink-2);margin:8px 0 0}
  #info{bottom:14px; right:14px; width:262px; padding:12px 14px; display:none}
  #info .t{font-size:13px;font-weight:600;margin:0 0 6px}
  #legendfoot{position:absolute;bottom:8px;left:14px;font-size:10.5px;color:var(--ink-3);
    text-shadow:0 1px 2px #fff}
  .maplibregl-popup-content{font-size:12px;padding:8px 10px;border-radius:6px}
</style>
</head>
<body>
<div id="map"></div>

<div id="panel" class="card">
  <h1>札幌都心 交通網</h1>
  <p class="sub">Phase 0 / 国土数値情報 N13 2024</p>

  <h2>区域</h2>
  <div class="kv" id="kv-area"></div>

  <h2>表示</h2>
  <div id="toggles"></div>

  <h2>街路を選ぶ</h2>
  <select id="streetsel"><option value="">— すべて —</option></select>
  <p class="note" id="streetinfo">通し街路を選ぶと、そのリンクだけを強調します。</p>

  <h2>JARTIC / センサス</h2>
  <div id="overlays"></div>
  <p class="note" id="datanote"></p>

  <h2>幅員区分</h2>
  <div id="widths"></div>

  <h2>リンク長</h2>
  <div class="kv" id="kv-len"></div>

  <button id="reset" style="margin-top:14px">視点を戻す</button>
</div>

<div id="info" class="card">
  <p class="t" id="i-name">—</p>
  <div class="kv" id="i-kv"></div>
</div>

<div id="legendfoot">地図: 国土地理院タイル / 道路: 国土数値情報(国土交通省)を加工</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
const META = __META__;
const NETWORK = __NETWORK__;
const CORDON = __CORDON__;
const LATTICE = __LATTICE__;
const REG_POINT = __REG_POINT__;
const REG_LINE = __REG_LINE__;
const SIGNALS = __SIGNALS__;
const CENSUS = __CENSUS__;

const KIND_COLOR = {
  "格子街路":"#3d7ab8", "裏通り":"#d98c3f", "斜行・非格子":"#9aa2ab", "格子外":"#c2555c",
  "未割り当て":"#9aa2ab"
};

const map = new maplibregl.Map({
  container:'map',
  style:{
    version:8,
    glyphs:"https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf",
    sources:{
      gsi:{type:'raster',
        tiles:['https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png'],
        tileSize:256, maxzoom:18,
        attribution:'<a href="https://maps.gsi.go.jp/development/ichiran.html">国土地理院</a>'}
    },
    layers:[{id:'bg',type:'background',paint:{'background-color':'#fbfcfd'}},
            {id:'gsi',type:'raster',source:'gsi',paint:{'raster-opacity':.55,'raster-saturation':-.6}}]
  },
  center:META.center, zoom:14.2, bearing:META.bearing, pitch:0, hash:false
});
map.addControl(new maplibregl.NavigationControl({visualizePitch:false}),'bottom-left');
map.addControl(new maplibregl.ScaleControl({maxWidth:110,unit:'metric'}),'bottom-left');

const HOME = {center:META.center, zoom:14.2, bearing:META.bearing};

map.on('load', () => {
  map.addSource('cordon',{type:'geojson',data:CORDON});
  map.addSource('lattice',{type:'geojson',data:LATTICE});
  map.addSource('net',{type:'geojson',data:NETWORK});

  map.addLayer({id:'clip-line',type:'line',source:'cordon',
    filter:['==',['get','kind'],'clip'],
    paint:{'line-color':'#8b9199','line-width':1,'line-dasharray':[3,3],'line-opacity':.7}});
  map.addLayer({id:'cordon-fill',type:'fill',source:'cordon',
    filter:['==',['get','kind'],'cordon'],
    paint:{'fill-color':'#2f8f6b','fill-opacity':.045}});
  map.addLayer({id:'cordon-line',type:'line',source:'cordon',
    filter:['==',['get','kind'],'cordon'],
    paint:{'line-color':'#2f8f6b','line-width':2}});

  map.addLayer({id:'lattice',type:'line',source:'lattice',
    paint:{'line-color':'#3d7ab8','line-width':.7,'line-dasharray':[2,4],'line-opacity':.5}});

  map.addLayer({id:'links',type:'line',source:'net',
    layout:{'line-cap':'round'},
    paint:{
      'line-color':['match',['get','street_kind'],
        '格子街路',KIND_COLOR['格子街路'],
        '裏通り',KIND_COLOR['裏通り'],
        '斜行・非格子',KIND_COLOR['斜行・非格子'],
        '格子外',KIND_COLOR['格子外'],
        KIND_COLOR['未割り当て']],
      'line-width':['interpolate',['linear'],['zoom'],
        12,['case',['get','through'],1.4,.7],
        16,['case',['get','through'],3.6,1.8],
        18,['case',['get','through'],7,3.4]],
      'line-opacity':.9
    }});

  map.addLayer({id:'grade',type:'line',source:'net',
    filter:['in',['get','road_state'],['literal',['トンネル','橋・高架']]],
    paint:{'line-color':'#7b52c4','line-width':
      ['interpolate',['linear'],['zoom'],12,2.4,16,6,18,11],'line-opacity':.85}});

  // --- 重ねるデータ ---
  map.addSource('regline',{type:'geojson',data:REG_LINE});
  map.addSource('regpoint',{type:'geojson',data:REG_POINT});
  map.addSource('signals',{type:'geojson',data:SIGNALS});
  map.addSource('census',{type:'geojson',data:CENSUS});

  map.addLayer({id:'census',type:'line',source:'census',
    layout:{visibility:'none'},
    paint:{'line-color':'#b8860b','line-width':
      ['interpolate',['linear'],['zoom'],12,3,16,9,18,16],'line-opacity':.4}});

  map.addLayer({id:'reg-oneway',type:'line',source:'regline',
    filter:['==',['get','code'],'11'], layout:{visibility:'none','line-cap':'round'},
    paint:{'line-color':'#c1571f','line-width':
      ['interpolate',['linear'],['zoom'],12,1.6,16,4,18,7],'line-opacity':.9}});

  map.addLayer({id:'reg-speed',type:'line',source:'regline',
    filter:['==',['get','code'],'112'], layout:{visibility:'none','line-cap':'round'},
    paint:{'line-color':'#7b52c4','line-width':
      ['interpolate',['linear'],['zoom'],12,1.4,16,3.4,18,6],'line-opacity':.8}});

  map.addLayer({id:'reg-stop',type:'circle',source:'regpoint',
    filter:['==',['get','code'],'63'], layout:{visibility:'none'},
    paint:{'circle-color':'#d64545','circle-radius':
      ['interpolate',['linear'],['zoom'],12,2,16,4.5,18,7],
      'circle-opacity':.85,'circle-stroke-width':.5,'circle-stroke-color':'#fff'}});

  map.addLayer({id:'reg-signal',type:'circle',source:'regpoint',
    filter:['==',['get','code'],'98'], layout:{visibility:'none'},
    paint:{'circle-color':'#3d8b40','circle-radius':
      ['interpolate',['linear'],['zoom'],12,2,16,4.5,18,7],
      'circle-opacity':.8,'circle-stroke-width':.5,'circle-stroke-color':'#fff'}});

  map.addLayer({id:'signals',type:'circle',source:'signals',
    paint:{'circle-color':'#1f6feb','circle-radius':
      ['interpolate',['linear'],['zoom'],12,4,16,9,18,14],
      'circle-opacity':.9,'circle-stroke-width':1.4,'circle-stroke-color':'#fff'}});

  map.addLayer({id:'sel',type:'line',source:'net',
    filter:['==',['get','street'],'__none__'],
    paint:{'line-color':'#1a1c1e','line-width':
      ['interpolate',['linear'],['zoom'],12,3,16,8,18,15],'line-opacity':.35}});

  map.addLayer({id:'hover',type:'line',source:'net',
    filter:['==',['get','link_id'],'__none__'],
    paint:{'line-color':'#1a1c1e','line-width':
      ['interpolate',['linear'],['zoom'],12,3,16,7,18,13],'line-opacity':.55}});

  buildUI();
  wireInteraction();
});

function countOf(layerId){
  const code = {'reg-oneway':'11','reg-stop':'63','reg-signal':'98','reg-speed':'112'}[layerId];
  if (layerId==='signals') return SIGNALS.features.filter(f=>f.properties.in_cordon).length;
  if (layerId==='census')  return CENSUS.features.filter(f=>f.properties.in_cordon).length;
  const src = ['reg-oneway','reg-speed'].includes(layerId) ? REG_LINE : REG_POINT;
  return src.features.filter(f=>f.properties.code===code && f.properties.in_cordon).length;
}

function buildUI(){
  const kv = document.getElementById('kv-area');
  const rows = [
    ['大きさ', META.cordon_size[0]+' × '+META.cordon_size[1]+' m'],
    ['グリッド方位', META.grid_bearing.toFixed(3)+'°'],
    ['リンク', META.n_links],
    ['ノード', META.n_nodes],
    ['交差点(次数3+)', META.n_junctions],
    ['同定街路', META.n_streets],
    ['通し街路', META.n_through+' (格子'+META.n_through_lattice+' / 裏'+META.n_through_backstreet+')']
  ];
  kv.innerHTML = rows.map(r=>`<span>${r[0]}</span><span>${r[1]}</span>`).join('');

  const L = META.link_length;
  document.getElementById('kv-len').innerHTML = [
    ['中央値',L.median+' m'],['25%',L.p25+' m'],['75%',L.p75+' m'],
    ['30m未満',L.n_under_30m+' 本'],['12m未満',L.n_under_12m+' 本'],['最長',L.max+' m']
  ].map(r=>`<span>${r[0]}</span><span>${r[1]}</span>`).join('');

  const wtot = Object.values(META.width_class).reduce((a,b)=>a+b,0);
  document.getElementById('widths').innerHTML = Object.entries(META.width_class)
    .map(([k,v])=>{
      const label = k.split(':')[1] || k;
      return `<div style="font-size:11.5px;color:var(--ink-2);display:flex;
        justify-content:space-between"><span>${label}</span>
        <span style="font-family:ui-monospace">${v}</span></div>
        <div class="bar"><i style="width:${(v/wtot*100).toFixed(1)}%"></i></div>`;
    }).join('');

  const overlays = [
    ['signals','交差点制御情報(サイクル長)','#1f6feb',true],
    ['reg-oneway','一方通行','#c1571f',false],
    ['reg-stop','一時停止','#d64545',false],
    ['reg-signal','信号機(規制情報)','#3d8b40',false],
    ['reg-speed','最高速度','#7b52c4',false],
    ['census','センサス区間','#b8860b',false],
  ];
  const ohost = document.getElementById('overlays');
  ohost.innerHTML = overlays.map((t,i)=>{
    const n = countOf(t[0]);
    return `<label class="row"><input type="checkbox" data-o="${i}" ${t[3]?'checked':''}>
      <span class="sw ${t[0].startsWith('reg-')||t[0]==='signals'?'dot':''}" style="background:${t[2]}"></span>${t[1]}
      <span style="margin-left:auto;font-family:ui-monospace;font-size:11px;color:var(--ink-3)">${n}</span></label>`;
  }).join('');
  ohost.querySelectorAll('input').forEach(el=>{
    el.onchange = () => {
      const t = overlays[+el.dataset.o];
      map.setLayoutProperty(t[0],'visibility', el.checked?'visible':'none');
    };
  });
  const note = document.getElementById('datanote');
  const np = META.regulations.not_provided || [];
  note.innerHTML =
    `規制情報 ${META.regulations.target_month || '—'} / 区域内 ${META.regulations.n_in_cordon} 件<br>`
    + `制御情報 区域内 ${META.signals.n_in_cordon} 交差点 (座標結合率 ${(META.signals.join_rate*100).toFixed(0)}%)`
    + `<br>サイクル長 ${META.signals.cycle.min}–${META.signals.cycle.max} 秒 (中央値 ${META.signals.cycle.median})`
    + `<br>センサス 区域内 ${META.census.n_in_cordon} 区間 / 延長被覆 ${(META.census.coverage*100).toFixed(0)}%`
    + (np.length ? `<br><b>北海道が提供していない規制:</b> ${np.join('、')}` : '');

  const toggles = [
    ['links','格子街路',       KIND_COLOR['格子街路'], 'kind', '格子街路'],
    ['links','裏通り',         KIND_COLOR['裏通り'],   'kind', '裏通り'],
    ['links','斜行・格子外',    KIND_COLOR['斜行・非格子'],'kind','その他'],
    ['grade','トンネル・高架',  '#7b52c4', 'layer', null],
    ['lattice','格子線',       '#3d7ab8', 'layer', null],
    ['cordon-line','コードン',  '#2f8f6b', 'layer', null],
    ['clip-line','クリップ範囲','#8b9199', 'layer', null],
  ];
  const host = document.getElementById('toggles');
  host.innerHTML = toggles.map((t,i)=>
    `<label class="row"><input type="checkbox" data-i="${i}" checked>
      <span class="sw" style="background:${t[2]}"></span>${t[1]}</label>`).join('');
  const kindOn = new Set(['格子街路','裏通り','その他']);
  host.querySelectorAll('input').forEach(el=>{
    el.onchange = () => {
      const t = toggles[+el.dataset.i];
      if (t[3]==='layer'){
        map.setLayoutProperty(t[0],'visibility', el.checked?'visible':'none');
      } else {
        el.checked ? kindOn.add(t[4]) : kindOn.delete(t[4]);
        const list = [];
        if (kindOn.has('格子街路')) list.push('格子街路');
        if (kindOn.has('裏通り')) list.push('裏通り');
        if (kindOn.has('その他')) list.push('斜行・非格子','格子外','未割り当て');
        map.setFilter('links', ['in',['get','street_kind'],['literal',list]]);
      }
    };
  });

  const sel = document.getElementById('streetsel');
  const streets = [...new Set(NETWORK.features
      .filter(f=>f.properties.through)
      .map(f=>f.properties.street))];
  streets.sort((a,b)=>a.localeCompare(b,'ja'));
  for (const s of streets){
    const o = document.createElement('option'); o.value=s; o.textContent=s; sel.appendChild(o);
  }
  sel.onchange = () => {
    const v = sel.value;
    map.setFilter('sel',['==',['get','street'], v || '__none__']);
    const info = document.getElementById('streetinfo');
    if (!v){ info.textContent='通し街路を選ぶと、そのリンクだけを強調します。'; return; }
    const fs = NETWORK.features.filter(f=>f.properties.street===v);
    const len = fs.reduce((a,f)=>a+f.properties.length_m,0);
    const kinds = [...new Set(fs.map(f=>f.properties.width_class))].join(' / ');
    info.innerHTML = `<b>${v}</b> — ${fs.length} リンク / 延長 ${len.toFixed(0)} m<br>幅員: ${kinds}`;
  };

  document.getElementById('reset').onclick = () => map.easeTo({...HOME, duration:600});
}

function wireInteraction(){
  const info = document.getElementById('info');
  const iname = document.getElementById('i-name');
  const ikv = document.getElementById('i-kv');
  let last = null;

  map.on('mousemove','links', e => {
    const p = e.features[0].properties;
    if (p.link_id === last) return;
    last = p.link_id;
    map.getCanvas().style.cursor='pointer';
    map.setFilter('hover',['==',['get','link_id'],p.link_id]);
    iname.textContent = p.street==='(未割り当て)' ? '(街路未割り当て)' : p.street;
    const rows = [
      ['link_id', p.link_id],
      ['種別', p.street_kind + (p.through==='true'||p.through===true?' / 通し':'')],
      ['方向', p.axis||'—'],
      ['長さ', p.length_m+' m'],
      ['道路分類', p.road_category],
      ['幅員区分', p.width_class],
      ['道路状態', p.road_state],
      ['格子誤差', p.assign_err_m==null?'—':p.assign_err_m+' m'],
    ];
    ikv.innerHTML = rows.map(r=>`<span>${r[0]}</span><span>${r[1]}</span>`).join('');
    info.style.display='block';
  });
  map.on('mouseleave','links', () => {
    last=null; map.getCanvas().style.cursor='';
    map.setFilter('hover',['==',['get','link_id'],'__none__']);
    info.style.display='none';
  });
  const detail = [
    ['signals', p => `<b>${p.jartic_id}</b><br>現示 ${p.n_phases} / 流入 ${p.n_in_links} 本
       <br>サイクル長 ${p.cycle_min_s}–${p.cycle_max_s} 秒<br>時間帯 ${p.n_hours} 区分`],
    ['census', p => `<b>${p.route}</b><br>区間 ${p.section_id}
       <br>車線数 ${p.n_lanes} / 車道部幅員 ${p.w_carriageway} m
       <br>指定最高速度 ${p.speed_limit} km/h
       <br>混雑時 ${p.v_peak_up} km/h / 非混雑時 ${p.v_off_up} km/h
       <br>大型車混入率 ${p.heavy_pct} % / 混雑度 ${p.congestion}
       <br>12時間交通量 ${p.v12h} 台`],
    ['reg-oneway', p => `<b>一方通行</b><br>頂点順が通行方向<br>延長 ${p.length ?? '—'} m`],
    ['reg-stop', p => `<b>一時停止</b>${p.crossing ? '<br>'+p.crossing : ''}`],
    ['reg-signal', p => `<b>信号機</b>${p.crossing ? '<br>'+p.crossing : ''}`],
    ['reg-speed', p => `<b>最高速度</b><br>${p.kind ?? ''}<br>速度 ${p.speed ?? '—'}`],
  ];
  for (const [id, fmt] of detail){
    if (!map.getLayer(id)) continue;
    map.on('click', id, e => {
      new maplibregl.Popup({closeButton:true, maxWidth:'260px'})
        .setLngLat(e.lngLat).setHTML(fmt(e.features[0].properties)).addTo(map);
    });
    map.on('mouseenter', id, () => map.getCanvas().style.cursor='pointer');
    map.on('mouseleave', id, () => map.getCanvas().style.cursor='');
  }

  map.on('click','lattice', e => {
    new maplibregl.Popup({closeButton:false})
      .setLngLat(e.lngLat).setText(e.features[0].properties.name).addTo(map);
  });
}
</script>
</body>
</html>
