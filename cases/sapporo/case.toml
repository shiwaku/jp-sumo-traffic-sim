# 札幌ケースの地域パラメータ(docs/sumo-design.md §14)。
# 汎用のパイプラインは config.py 経由でこの値を読む。
# 地域に依存する処理(格子座標・コードン)は module に書く。

name = "sapporo"
title = "札幌 環状通の内側"
# 区域ポリゴンなどケース固有の処理を持つモジュール
module = "jp_sumo_traffic_sim.cases.sapporo"

[crs]
# 平面直角座標系 XI系。距離・速度計算はすべてこの系で行う
proj = "EPSG:6679"

[ksj]
meshes = ["6441", "6440"]

[region]
# 対象区域の種類(docs/sumo-design.md §13.4)
#   ring  = 環状通(センサスの路線名 ring_route)の内側 + 環状通(両側の車道を ring_buffer_m で含む)
#   admin = 札幌市の行政界(国土数値情報 N03、scripts/fetch_n03.py)
kind = "ring"
ring_route = "札幌環状線"
ring_buffer_m = 60.0
# kind = "admin" のときの市区町村コード(10 区)
admin_codes = ["01101", "01102", "01103", "01104", "01105", "01106", "01107", "01108", "01109", "01110"]
# 抽出は流入路を残すため区域の外側にバッファを取る [m]
clip_buffer_m = 500

[network]
# 区域内の車道をすべて入れる(環状通の内側、§13.4)。false なら以下の条件で選ぶ(市全域のときの設定)
all_roads = true
# all_roads = false のとき: 都心区域(core_polygon)は全道路、それ以外は以下
# KSJ N13_003: 1=国道 2=都道府県道 4=高速自動車国道等
categories = ["1", "2", "4"]
# 市区町村道(N13_003=3)は幅員区分 4(13-19.5m)・5(19.5m以上)だけ入れる
municipal_widths = ["4", "5"]
# センサス区間に沿って走る市道も入れる(照合点を落とさない)。
# 両端点と中点がすべてセンサス区間の中心線から census_dist_m 以内のリンク
census_dist_m = 20.0

[jartic]
# 交通規制情報(typeD)の配布ファイル名
regulation_zip = "typeD_hokkaido.zip"
# 交差点制御情報の情報源コード。北海道: 札幌3001 / 函館3002 / 旭川3003 / 釧路3004 / 北見3005
control_source_code = "3001"

# カタログ(opendata.json)の (type, targetList の id) と用途
[[jartic.catalog]]
type = "typeC"
id = "R01_1"
purpose = "交差点制御情報(札幌)"

[[jartic.catalog]]
type = "typeD"
id = "R01"
purpose = "交通規制情報(北海道)"

[[jartic.catalog]]
type = "typeB"
id = "R01_1"
purpose = "断面交通量情報(札幌)"

[census]
# 時間帯別交通量(jikantai/{pref_code}.json)の都道府県コード
pref_code = "01"

[zones]
# ゾーンの入力(docs/sumo-design.md §13.5、D3)。パスは ROOT からの相対か絶対
# 国勢調査 2020 の 125m メッシュ人口(e-stat-census-converter で境界と結合したもの)
pop_mesh125 = "../e-stat/国勢調査タイル化検証用データ/境界データと統計データの結合（125mメッシュ）/2020_pop_census_mesh125.parquet"
# 上のファイルから読む 1 次メッシュ
mesh1 = ["6441"]
# 国勢調査 2020 の小地域の境界(e-Stat、JGD2011 Shapefile の zip)
small_area_boundary = "../e-stat-census-converter/data/raw/boundary/2020/A002005212020_JGD2011_01.zip"
# 経済センサス 2021 の小地域の事業所数・従業者数(e-Stat 統計表 T001168、data/raw 配下)
econ_census = "data/raw/estat/T001168_01/tblT001168C01.txt"
# 対象の市区町村コードの接頭辞(小地域の境界・経済センサスの絞り込み)
city_prefix = "0110"

[viewer]
center = [141.3501, 43.0591]
